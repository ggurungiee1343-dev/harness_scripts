# Hermes Policy Engine — 기본 정책
# 이 파일을 수정하여 액션 접근 권한을 제어하세요.
# modes: "*" (전체), "deepseek", "gemma4", "nvidia"
version: 1
default_action: allow

rules:
  # ========================================================
  # [우선순위 상위] 모드별 제한 규칙 (먼저 매칭됨)
  # ========================================================

  # Gemma4 모드: 중요 파일 작업 제한
  - actions: ["file_delete", "file_rename", "file_move"]
    allow: false
    modes: ["gemma4"]
    reason: "Gemma4 모드에서는 파일 삭제/이동이 제한됩니다."

  # ========================================================
  # 위험 명령어 차단
  # ========================================================
  - actions: ["exec_bash_dangerous"]
    allow: false
    modes: ["*"]
    reason: "시스템 위험 명령어는 허용되지 않습니다."

  # ========================================================
  # [우선순위 하위] 일반 허용 규칙
  # ========================================================

  # 읽기/검색/웹 — 모든 모드 허용
  - actions: ["file_read", "file_list", "file_search", "web_read"]
    allow: true
    modes: ["*"]

  # 쓰기 작업 (Vault 내 경로 제한)
  - actions: ["file_write", "file_create"]
    allow: true
    modes: ["*"]
    path_patterns:
      - "/Users/bluesea/Applications/*"
      - "/Users/bluesea/.hermes/*"
      - "/Users/bluesea/hermes/*"

  # 파일 변경 작업 — 확인 필요
  - actions: ["file_delete", "file_rename", "file_move", "file_copy"]
    allow: true
    require_confirm: true
    modes: ["*"]
    reason: "파일 변경 작업은 확인 후 실행됩니다."
