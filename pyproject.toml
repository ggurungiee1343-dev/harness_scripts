[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes3"
version = "0.8.3"
description = "Hermes v8.3 integrated assistant runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-telegram-bot>=22.5",
  "PyYAML>=6.0",
  "aiohttp>=3.9",
  "PyPDF2>=3.0",
  "arxiv>=2.1.3",
  "google-api-python-client>=2.0.0",
  "google-auth>=2.0.0",
]

[tool.setuptools]
py-modules = []
